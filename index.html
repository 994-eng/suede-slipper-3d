<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="favicon.png" type="image/png" />
<title>焦糖毛毛拖 · 3D</title>
<style>
:root{--cream:#f4efe6;--gold:#c4a574}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1512;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a2a22 0%,#1a1512 70%);transition:opacity .9s ease,visibility .9s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-mark{width:56px;height:56px;border-radius:50%;border:2px solid rgba(196,165,116,.25);border-top-color:var(--gold);animation:spin .9s linear infinite;margin-bottom:22px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-size:22px;letter-spacing:.28em;margin-bottom:8px}
.loader-sub{font-size:12px;letter-spacing:.18em;color:rgba(244,239,230,.45)}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity 1.2s ease .2s}
#hud.show{opacity:1}
.top-bar{position:absolute;top:0;left:0;right:0;padding:28px 32px 0;display:flex;justify-content:space-between;align-items:flex-start}
.brand h1{font-size:clamp(18px,2.4vw,26px);font-weight:500;letter-spacing:.22em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.brand p{margin-top:6px;font-size:11px;letter-spacing:.32em;color:rgba(244,239,230,.5)}
.controls{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{appearance:none;border:1px solid rgba(196,165,116,.35);background:rgba(26,21,18,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--cream);font-size:12px;letter-spacing:.12em;padding:10px 14px;border-radius:999px;cursor:pointer;transition:all .25s ease;font-family:inherit}
.btn:hover{border-color:var(--gold);background:rgba(92,61,46,.45)}
.btn.on{background:rgba(196,165,116,.22);border-color:var(--gold);color:#f0e0c8}
.hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.28em;color:rgba(244,239,230,.55);white-space:nowrap;text-shadow:0 2px 16px rgba(0,0,0,.4);transition:opacity .6s}
.hint.fade{opacity:0}
.badge{position:absolute;bottom:28px;left:32px;font-size:10px;letter-spacing:.2em;color:rgba(244,239,230,.35)}
@media(max-width:640px){.top-bar{padding:18px 16px 0;flex-direction:column;gap:14px}.controls{width:100%;justify-content:flex-start}.hint{bottom:18px;letter-spacing:.16em;font-size:11px}.badge{display:none}}
</style>
</head>
<body>
<div id="loader"><div class="loader-mark"></div><div class="loader-title">焦糖毛毛拖</div><div class="loader-sub">正在缝制绒面与毛领…</div></div>
<div id="app"></div>
<div id="hud">
  <div class="top-bar">
    <div class="brand"><h1>焦糖毛毛拖</h1><p>Caramel Shearling Clog · Blender</p></div>
    <div class="controls">
      <button class="btn on" id="btnAuto" type="button">自动旋转</button>
      <button class="btn on" id="btnSpot" type="button">柔光灯</button>
      <button class="btn" id="btnMotes" type="button">尘埃微光</button>
      <button class="btn" id="btnReset" type="button">复位视角</button>
    </div>
  </div>
  <div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 双指捏合</div>
  <div class="badge">BLENDER SCULPT · STUDIO PREVIEW</div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1512);
scene.fog = new THREE.FogExp2(0x1a1512, 0.045);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 40);
camera.position.set(1.35, 1.05, 1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.7;
controls.maxDistance = 4.5;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 0.12, 0);
const homePos = camera.position.clone();
const homeTarget = controls.target.clone();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Wood floor
function makeWood() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(1024, 512), d = img.data;
  for (let y = 0; y < 512; y++) {
    const pl = Math.floor(y / 64);
    for (let x = 0; x < 1024; x++) {
      const g = Math.sin((x + pl * 40) * 0.03 + Math.sin(y * 0.02) * 2);
      const n = Math.sin(x * 0.02 + pl) * 0.5 + 0.5;
      let b = 210 + n * 18 + g * 8, r = b, gg = b * 0.88, bb = b * 0.68;
      if (y % 64 < 1.5) { r *= 0.8; gg *= 0.8; bb *= 0.8; }
      const i = (y * 1024 + x) * 4;
      d[i] = r; d[i + 1] = gg; d[i + 2] = bb; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
  return t;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.MeshStandardMaterial({ map: makeWood(), roughness: 0.72, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Lights
const amb = new THREE.AmbientLight(0xfff0e0, 0.35);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xffe8d0, 0x3a2a22, 0.55);
scene.add(hemi);
const key = new THREE.SpotLight(0xffe2c4, 2.4, 12, Math.PI / 5, 0.45, 1);
key.position.set(2.2, 3.2, 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0002;
key.target.position.set(0, 0.1, 0); scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight(0xfff5ea, 0.55);
fill.position.set(-2.5, 2.2, -1); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd4a8, 0.45);
rim.position.set(0.5, 1.5, -2.5); scene.add(rim);
const soft = new THREE.PointLight(0xffc9a0, 0.6, 6);
soft.position.set(-0.4, 1.4, 0.8); scene.add(soft);

// Dust motes
const moteN = 180;
const motePos = new Float32Array(moteN * 3);
for (let i = 0; i < moteN; i++) {
  motePos[i * 3] = (Math.random() - 0.5) * 3;
  motePos[i * 3 + 1] = 0.2 + Math.random() * 1.6;
  motePos[i * 3 + 2] = (Math.random() - 0.5) * 3;
}
const moteGeo = new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
  color: 0xffe6c8, size: 0.012, transparent: true, opacity: 0.0, depthWrite: false, sizeAttenuation: true
}));
scene.add(motes);

let autoRotate = true, spotOn = true, motesOn = false;
const pair = new THREE.Group();
scene.add(pair);

const loader = new GLTFLoader();
loader.load(
  './models/suede_clogs.glb',
  (gltf) => {
    const root = gltf.scene;
    root.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) {
          o.material.envMapIntensity = 0.35;
          // deepen suede-looking materials
          if (o.material.color && o.material.metalness < 0.5) {
            const c = o.material.color;
            if (c.r > 0.2 && c.r < 0.7 && c.g < c.r) {
              c.multiplyScalar(0.72);
              o.material.roughness = Math.max(o.material.roughness || 0.8, 0.88);
            }
          }
        }
      }
    });
    // Center & scale to nice view size
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    root.position.y += size.y * 0.5; // sit on floor
    // lift so min Y = 0
    const box2 = new THREE.Box3().setFromObject(root);
    root.position.y -= box2.min.y;
    const s = 1.35 / Math.max(size.x, size.z);
    root.scale.setScalar(s);
    pair.add(root);
    document.getElementById('loader').classList.add('hide');
    document.getElementById('hud').classList.add('show');
    setTimeout(() => document.getElementById('hint').classList.add('fade'), 4200);
  },
  undefined,
  (err) => {
    console.error(err);
    document.querySelector('.loader-sub').textContent = '模型加载失败，请刷新重试';
  }
);

document.getElementById('btnAuto').onclick = (e) => {
  autoRotate = !autoRotate; e.currentTarget.classList.toggle('on', autoRotate);
};
document.getElementById('btnSpot').onclick = (e) => {
  spotOn = !spotOn; key.visible = soft.visible = spotOn; e.currentTarget.classList.toggle('on', spotOn);
};
document.getElementById('btnMotes').onclick = (e) => {
  motesOn = !motesOn; motes.material.opacity = motesOn ? 0.55 : 0; e.currentTarget.classList.toggle('on', motesOn);
};
document.getElementById('btnReset').onclick = () => {
  camera.position.copy(homePos); controls.target.copy(homeTarget); controls.update();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  if (autoRotate) pair.rotation.y += 0.0032;
  if (motesOn) {
    const p = moteGeo.attributes.position.array;
    for (let i = 0; i < moteN; i++) {
      p[i * 3 + 1] += Math.sin(t * 0.4 + i) * 0.0004;
      if (p[i * 3 + 1] > 1.9) p[i * 3 + 1] = 0.15;
    }
    moteGeo.attributes.position.needsUpdate = true;
  }
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
